<div class="container">
  <div class="card">
    <h2>🔐 Secure Login</h2>

    <div *ngIf="error" class="alert alert-error">
      ⚠️ {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()" #f="ngForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="Enter your email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="Enter your password" />
      </div>
      <button type="submit" [disabled]="loading || !f.valid">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p class="link">Don't have an account? <a routerLink="/register">Register</a></p>
  </div>
</div>
