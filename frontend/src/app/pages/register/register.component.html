<div class="container">
  <div class="card">
    <h2>📝 Create Account</h2>

    <div *ngIf="error" class="alert alert-error">⚠️ {{ error }}</div>
    <div *ngIf="success" class="alert alert-success">✅ {{ success }}</div>

    <form (ngSubmit)="onSubmit()" #f="ngForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" [(ngModel)]="username" name="username" required placeholder="Choose a username" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="Enter your email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required minlength="6" placeholder="Min 6 characters" />
      </div>
      <button type="submit" [disabled]="loading || !f.valid">
        {{ loading ? 'Creating...' : 'Register' }}
      </button>
    </form>

    <p class="link">Already have an account? <a routerLink="/login">Login</a></p>
  </div>
</div>
