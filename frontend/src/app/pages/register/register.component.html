<div class="container">
  <div class="card">

    <!-- SPEC: Page title for registration page -->
    <h2>📝 Create Account</h2>

    <!-- SPEC: Error alert — shown when registration fails
         e.g. "Username or email already exists" from backend -->
    <div *ngIf="error" class="alert alert-error">⚠️ {{ error }}</div>

    <!-- SPEC: Success alert — shown after successful registration
         Auto-redirects to /login after 1.5 seconds -->
    <div *ngIf="success" class="alert alert-success">✅ {{ success }}</div>

    <!-- SPEC: Registration form — sends POST /api/auth/register
         Backend hashes password with bcrypt (salt rounds: 12) before saving to MongoDB -->
    <form (ngSubmit)="onSubmit()" #f="ngForm">

      <!-- SPEC: Username field — must be unique in the database -->
      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          required
          placeholder="Choose a username"
        />
        <small class="hint">💡 Must be unique — used to identify your account</small>
      </div>

      <!-- SPEC: Email field — must be unique, stored in lowercase -->
      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="Enter your email"
        />
        <small class="hint">💡 Must be a valid and unique email address</small>
      </div>

      <!-- SPEC: Password field — minimum 6 characters enforced on both frontend and backend
           Hashed with bcrypt before storing — never saved as plain text -->
      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          minlength="6"
          placeholder="Min 6 characters"
        />
        <small class="hint">💡 Minimum 6 characters — hashed with bcrypt (salt: 12)</small>
      </div>

      <!-- SPEC: Submit disabled if form is invalid or request is in progress -->
      <button type="submit" [disabled]="loading || !f.valid">
        {{ loading ? 'Creating...' : 'Register' }}
      </button>

    </form>

    <p class="link">Already have an account? <a routerLink="/login">Login</a></p>
  </div>
</div>
